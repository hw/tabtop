# Tests tabtopd, builds the two images and checks them, and pushes them
# once all of that passes: tabtop, with its own desktop, checked end to end
# in headless Chrome (test/browser-check.sh), to ghcr.io/<owner>/<repo>;
# and tabtop-lite, built without one (DESKTOP=none) for VNC_ADDR, checked
# against Xvnc from the first (test/lite-check.sh), to
# ghcr.io/<owner>/<repo>-lite. Pull requests are built and checked but not
# pushed.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Go version pinned in mise.toml.
      - uses: jdx/mise-action@v5
      # tabtopd uses libopus (audio) and liboath (logins) through cgo.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev liboath-dev
      - run: test -z "$(gofmt -l tabtopd)" || { gofmt -l tabtopd; exit 1; }
      - run: mise run vet
      - run: mise run test
      - run: mise run test-js

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Node, pinned in mise.toml, runs the browser check; the runner has
      # Chrome.
      - uses: jdx/mise-action@v5
      - uses: docker/setup-buildx-action@v4
      # Built into the local Docker first, to check before pushing; the
      # pushes below reuse the caches, one for each image.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tabtop:check
          cache-from: type=gha,scope=tabtop
          cache-to: type=gha,mode=max,scope=tabtop
      # Media preview checks generate MP3/MKV/MP4 fixtures with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: test/browser-check.sh tabtop:check
      - run: test/browser-check.sh tabtop:check --group services
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: DESKTOP=none
          tags: tabtop-lite:check
          cache-from: type=gha,scope=tabtop-lite
          cache-to: type=gha,mode=max,scope=tabtop-lite
      - run: test/lite-check.sh tabtop-lite:check tabtop:check
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :main and :latest; tag v1.2.3 → :1.2.3 and :1.2; every push
      # also gets :sha-<short sha>. Both images get the same tags.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - id: meta-lite
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-lite
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tabtop
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: DESKTOP=none
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-lite.outputs.tags }}
          labels: ${{ steps.meta-lite.outputs.labels }}
          cache-from: type=gha,scope=tabtop-lite
