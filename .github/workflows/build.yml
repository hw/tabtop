# Tests tabtopd, builds the two images and checks them, and pushes them
# once all of that passes: tabtop, with its own desktop, checked end to end
# in headless Chrome (test/browser-check.sh), to ghcr.io/<owner>/<repo>;
# and tabtop-lite, built without one (DESKTOP=none) for VNC_ADDR, checked
# against Xvnc from the first (test/lite-check.sh), to
# ghcr.io/<owner>/<repo>-lite, whose remote browser (/go) is checked too
# (test/go-check.sh). Pull requests are built and checked but not pushed.
#
# The tests and the images' builds start together; the checks, each in a
# job of its own, start once the images are built (in the GHA cache, which
# each check's build loads from), and run side by side; the push waits for
# them all.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Go version pinned in mise.toml.
      - uses: jdx/mise-action@v5
      # tabtopd uses libopus (audio) and liboath (logins) through cgo; the
      # remote browser's engine runs in bubblewrap.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev liboath-dev libsqlite3-dev bubblewrap
      # Ubuntu's runners only let AppArmor-profiled programs make user
      # namespaces, which bubblewrap needs; without this, the sandbox's
      # tests would skip.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The image's Moli (the Dockerfile's MOLI_ version and checksum), for
      # the remote browser's tests with the real engine (TABTOP_TEST_MOLI).
      - name: Moli
        run: |
          version=$(sed -n 's/^ARG MOLI_VERSION=//p' Dockerfile)
          sum=$(sed -n 's/^ARG MOLI_AMD64_SHA256=//p' Dockerfile)
          curl -fsSL -o "$RUNNER_TEMP/moli.tar.gz" \
              "https://github.com/lexmount/moli/releases/download/v$version/moli-x86_64-unknown-linux-gnu.tar.gz"
          echo "$sum  $RUNNER_TEMP/moli.tar.gz" | sha256sum -c
          mkdir "$RUNNER_TEMP/moli"
          tar -xzf "$RUNNER_TEMP/moli.tar.gz" -C "$RUNNER_TEMP/moli" --strip-components=1
          echo "TABTOP_TEST_MOLI=$RUNNER_TEMP/moli/moli" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l tabtopd)" || { gofmt -l tabtopd; exit 1; }
      - run: mise run vet
      - run: mise run test
      - run: mise run test-js

  # Each image built once, into its cache, for the checks and the push
  # to load from.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Built as the checks and the push build them, for the same
          # cache keys.
          - image: tabtop
          - image: tabtop-lite
            build-args: DESKTOP=none
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # browser-check.sh in three parts, each about as long (its journey, and
  # the previews in two), and the groups that need a container of their
  # own after the shortest. The journey's part checks the lite image
  # against the full one's Xvnc too.
  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: journey
            groups: journey
            lite: true
          - part: images
            groups: images,models services
          - part: previews
            groups: zip,media,binary,text,html,markdown,pdf,epub,tables,sqlite
            # Its media checks make MP3/MKV/MP4 fixtures with FFmpeg.
            ffmpeg: true
    name: browser (${{ matrix.part }})
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Node, pinned in mise.toml, runs the browser check; the runner has
      # Chrome.
      - uses: jdx/mise-action@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tabtop:check
          cache-from: type=gha,scope=tabtop
      - if: matrix.ffmpeg
        uses: ./.github/actions/ffmpeg
      - run: for g in ${{ matrix.groups }}; do test/browser-check.sh tabtop:check --group "$g"; done
      - if: matrix.lite
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: DESKTOP=none
          tags: tabtop-lite:check
          cache-from: type=gha,scope=tabtop-lite
      - if: matrix.lite
        run: test/lite-check.sh tabtop-lite:check tabtop:check

  # The remote browser (/go), as it ships in the lite image: its Moli,
  # sandboxed by bubblewrap, end to end in headless Chrome; then with files
  # off, and unsandboxed. A pull request checks only the first.
  go:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'pull_request' && '["sandboxed"]' || '["sandboxed", "no-fs", "unsandboxed"]') }}
    name: go (${{ matrix.mode }})
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: DESKTOP=none
          tags: tabtop-lite:check
          cache-from: type=gha,scope=tabtop-lite
      # The test site's videos are made with FFmpeg.
      - uses: ./.github/actions/ffmpeg
      # Ubuntu's runners only let AppArmor-profiled programs make user
      # namespaces, containers' too.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          case "${{ matrix.mode }}" in
              no-fs) export GO_NO_FS=1 ;;
              unsandboxed) export GO_UNSANDBOXED=1 ;;
          esac
          GO_IMAGE=tabtop-lite:check test/go-check.sh

  push:
    needs: [test, browser, go]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :main and :latest; tag v1.2.3 → :1.2.3 and :1.2; every push
      # also gets :sha-<short sha>. Both images get the same tags.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - id: meta-lite
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-lite
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tabtop
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: DESKTOP=none
          push: true
          tags: ${{ steps.meta-lite.outputs.tags }}
          labels: ${{ steps.meta-lite.outputs.labels }}
          cache-from: type=gha,scope=tabtop-lite
