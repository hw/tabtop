# Tests tabtopd, builds the image, and pushes it to ghcr.io/<owner>/<repo>
# once the tests and the build pass. Pull requests are built but not pushed.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Go version pinned in mise.toml.
      - uses: jdx/mise-action@v5
      # tabtopd uses libopus (audio) and liboath (logins) through cgo.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev liboath-dev
      - run: test -z "$(gofmt -l tabtopd)" || { gofmt -l tabtopd; exit 1; }
      - run: mise run vet
      - run: mise run test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :main and :latest; tag v1.2.3 → :1.2.3 and :1.2; every push
      # also gets :sha-<short sha>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
