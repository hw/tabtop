<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cookies and site data</title>
<style>
:root { --safe-right: env(safe-area-inset-right, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; background: #1c1c1e; color: #e8e8ea; font: 14px system-ui, sans-serif; }
main { max-width: 40rem; margin: 0 auto; box-sizing: border-box;
    padding: 16px calc(16px + var(--safe-right)) calc(32px + var(--safe-bottom)) calc(16px + var(--safe-left)); }
header { display: flex; align-items: center; gap: 12px; }
header a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 10px; color: #8ab4f8; text-decoration: none; border-radius: 6px; }
header a:hover { background: #2c2c2e; }
h1 { margin: 0; font-size: 20px; }
.about { margin: 12px 0 16px; color: #a8a8ad; line-height: 1.45; }
button, select { min-height: 36px; font: 14px system-ui, sans-serif; color: #e8e8ea; border-radius: 6px; }
button { padding: 0 14px; background: #3a3a3c; border: 1px solid #48484a; cursor: pointer; }
button:disabled { color: #6c6c70; cursor: default; }
.clear { padding: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; }
.clear label { display: block; margin-bottom: 8px; }
.row { display: flex; gap: 8px; }
select { flex: 1; min-width: 0; padding: 0 8px; background: #1c1c1e; border: 1px solid #48484a; }
#clear { background: #8c2f2b; border-color: #8c2f2b; }
.done { min-height: 1.4em; margin: 10px 0; color: #a8d8a8; }
.done.error { color: #f2b8b5; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2c2c2e; }
.what { flex: 1; min-width: 0; }
.site { overflow-wrap: anywhere; font-size: 15px; }
.detail { margin-top: 2px; color: #a8a8ad; font-size: 12px; }
.empty { color: #a8a8ad; }
[hidden] { display: none !important; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }
@media (pointer: coarse), (max-width: 600px) {
    button, select, header a { min-height: 44px; }
}
</style>
<main>
    <header><a href="./" id="back">← Browser</a><h1>Cookies and site data</h1></header>
    <p class="about" id="about">Loading…</p>
    <div class="clear">
        <label for="within">Clear what sites set in</label>
        <div class="row">
            <select id="within">
                <option value="3600">the last hour</option>
                <option value="86400">the last 24 hours</option>
                <option value="604800">the last week</option>
                <option value="2592000">the last month</option>
                <option value="15724800">the last 6 months</option>
                <option value="0">all time</option>
            </select>
            <button type="button" id="clear">Clear</button>
        </div>
    </div>
    <p class="done" id="done" role="status" aria-live="polite"></p>
    <ul id="sites" aria-label="Sites"></ul>
    <p class="empty" id="empty" hidden>No site has kept anything.</p>
</main>
<script type="module" src="go-cookies.js"></script>
</html>
