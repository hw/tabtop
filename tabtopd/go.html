<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browser</title>
<style>
:root { --bar-height: 44px;
    /* A phone's notch, rounded corners and home bar (viewport-fit=cover):
       the bar and the page kept clear of them; 0 elsewhere. */
    --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px);
    --bar-total: calc(var(--bar-height) + var(--safe-top)); }
/* No pull-to-refresh (it would reload this page, not the page shown) nor
   overscroll bounce: a page's own scrolling ends at its ends. */
html, body { margin: 0; height: 100%; background: #1c1c1e; overflow: hidden; overscroll-behavior: none; font: 13px system-ui, sans-serif; color: #e8e8ea; }
body { height: 100dvh; display: grid; grid-template-rows: var(--bar-total) minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
#go_bar { position: relative; grid-row: 1; height: var(--bar-total); box-sizing: border-box; display: flex; align-items: center;
    gap: 4px; padding: var(--safe-top) calc(8px + var(--safe-right)) 0 calc(8px + var(--safe-left)); background: #2c2c2e; border-bottom: 1px solid #3a3a3c; }
#go_bar button { flex: 0 0 auto; min-width: 30px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    font: 16px system-ui, sans-serif; color: #e8e8ea; background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
#go_bar button svg { display: block; width: 18px; height: 18px; }
#go_bar button:hover:not(:disabled) { background: #3a3a3c; }
#go_bar button:disabled { color: #6c6c70; cursor: default; }
/* The address: the site only, but when it's being edited (the whole
   address then); reload, or stop while loading, or clear while editing, at
   its end. */
#go_address { position: relative; flex: 1; min-width: 0; display: flex; }
#go_address input { flex: 1; min-width: 0; height: 28px; box-sizing: border-box; padding: 0 32px 0 10px; font: 14px system-ui, sans-serif;
    color: #e8e8ea; background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 5px; text-overflow: ellipsis; }
#go_address input.site { text-align: center; }
#go_address input.insecure { color: #f2b8b5; }
#go_bar #go_address button { position: absolute; right: 0; top: 0; bottom: 0; height: auto; min-width: 30px; color: #a8a8ad; }
#go_bar #go_address button[hidden] { display: none; }
/* The tabs, on a phone (go-tabs.js shows them all). */
#go_tabs .count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 3px;
    box-sizing: border-box; border: 2px solid currentColor; border-radius: 5px; font: 600 11px system-ui, sans-serif; }
#go_bar #go_tabs[hidden] { display: none; }
/* The menu: the other pages, forward, logging out. */
#go_menu_panel { position: absolute; top: calc(100% + 4px); right: 4px; z-index: 6; min-width: 13rem; box-sizing: border-box; padding: 4px;
    background: #2c2c2e; border: 1px solid #48484a; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
#go_menu_panel[hidden] { display: none; }
#go_menu_panel .item, #go_menu_panel .tabtop-nav > * { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
    min-height: 36px; height: auto; padding: 0 10px; font: 14px system-ui, sans-serif; color: #e8e8ea; text-decoration: none; text-align: left;
    justify-content: flex-start; background: none; border: 0; border-radius: 6px; cursor: pointer; }
#go_menu_panel .item:hover:not(:disabled), #go_menu_panel .tabtop-nav > a:hover, #go_menu_panel .tabtop-nav > button:hover { background: #3a3a3c; }
#go_menu_panel .item:disabled { color: #6c6c70; cursor: default; }
#go_menu_panel .tabtop-nav { display: flex; flex-direction: column; margin-top: 4px; padding-top: 4px; border-top: 1px solid #545458; }
#go_menu_panel .tabtop-nav > .sep { display: block; min-height: 0; height: 1px; padding: 0; margin: 4px 0; background: #545458; border-radius: 0; }
#go_menu_panel .tabtop-nav > [hidden] { display: none; }
#go_menu_panel .tabtop-nav .page { color: #8ab4f8; }
#go_menu_panel .tabtop-nav .page[aria-current] { display: none; }  /* this page */
#go_menu_panel svg { flex: 0 0 auto; display: block; width: 20px; height: 20px; }
#go_menu_panel .label { color: #e8e8ea; }
/* The pages back (or forward), Back held. */
#go_history { position: absolute; top: calc(100% + 4px); left: 4px; z-index: 6; width: max-content; min-width: 14rem; max-width: min(24rem, calc(100vw - 16px));
    max-height: min(70vh, 32rem); overflow-y: auto; box-sizing: border-box; padding: 4px;
    background: #2c2c2e; border: 1px solid #48484a; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
#go_history[hidden] { display: none; }
#go_history .item { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; width: 100%; box-sizing: border-box;
    min-height: 44px; height: auto; padding: 4px 10px; font: 14px system-ui, sans-serif; color: #e8e8ea; text-align: left;
    background: none; border: 0; border-radius: 6px; cursor: pointer; }
#go_history .item:hover, #go_history .item:focus-visible { background: #3a3a3c; }
#go_history .title, #go_history .where { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#go_history .where { color: #a8a8ad; font-size: 12px; }
#go_back, #go_forward { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
/* The session warning, which the shared pages put in their bar of links:
   here, below this bar. And the login summary, at the bottom. */
#tabtop_expiry { position: fixed !important; top: calc(var(--bar-total) + 8px); left: 50%; transform: translateX(-50%); z-index: 7;
    max-width: calc(100vw - 24px); line-height: 28px !important; box-shadow: 0 2px 12px rgba(0, 0, 0, .4); }
#tabtop_login_summary { top: auto !important; bottom: calc(16px + var(--safe-bottom)); }
#tabtop_login_summary button { font: inherit; color: inherit; background: #3a3a3c; border: 1px solid #48484a; border-radius: 4px; padding: 4px 14px; cursor: pointer; }
#go_view { grid-row: 2; grid-column: 1; min-height: 0; min-width: 0; margin: 0 var(--safe-right) var(--safe-bottom) var(--safe-left);
    width: calc(100% - var(--safe-left) - var(--safe-right)); height: calc(100% - var(--safe-bottom));
    border: 0; background: #fff; transition: opacity .2s; }
/* The page being left, while the next is slow to come: dimmed. */
#go_view.leaving { opacity: .45; }
#go_status { position: absolute; left: calc(8px + var(--safe-left)); bottom: calc(8px + var(--safe-bottom)); max-width: calc(100% - 16px - var(--safe-left) - var(--safe-right)); box-sizing: border-box; padding: 4px 10px;
    color: #e8e8ea; background: rgba(44, 44, 46, .92); border: 1px solid #3a3a3c; border-radius: 6px; pointer-events: none; }
#go_status:empty { display: none; }
#go_notice { position: absolute; top: calc(var(--bar-total) + 10px); left: 50%; transform: translateX(-50%); width: min(34rem, calc(100% - 24px)); box-sizing: border-box;
    padding: 12px 16px; color: #e8e8ea; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .5); z-index: 5; max-height: calc(100% - var(--bar-total) - var(--safe-bottom) - 24px); overflow: auto; }
#go_notice[hidden] { display: none; }
/* A pop-up the page wants to open: asked (gosites.go). */
#go_popup { position: absolute; top: calc(var(--bar-total) + 10px); right: calc(12px + var(--safe-right)); width: min(24rem, calc(100% - 24px)); box-sizing: border-box;
    padding: 12px 16px; color: #e8e8ea; background: #2c2c2e; border: 1px solid #48484a; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .5); z-index: 6; }
#go_popup[hidden] { display: none; }
#go_popup p { margin: 0 0 10px; overflow-wrap: anywhere; }
#go_popup .remember { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; color: #b8b8bd; }
#go_popup .actions { display: flex; gap: 8px; justify-content: flex-end; }
#go_popup button { font: inherit; color: inherit; background: #3a3a3c; border: 1px solid #48484a; border-radius: 4px; padding: 4px 14px; cursor: pointer; }
#go_popup button.open { background: #2f5ea8; border-color: #2f5ea8; }
#go_notice.error { border-color: #d96b6b; }
#go_notice p { margin: 0 0 8px; overflow-wrap: anywhere; }
#go_notice button { font: inherit; color: inherit; background: #3a3a3c; border: 1px solid #48484a; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
#go_dialog { width: min(28rem, calc(100% - 32px)); box-sizing: border-box; padding: 16px; color: #e8e8ea; background: #2c2c2e;
    border: 1px solid #48484a; border-radius: 8px; }
#go_dialog::backdrop { background: rgba(0, 0, 0, .45); }
#go_dialog p { margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow: auto; }
#go_dialog input { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 6px 8px; font: inherit; color: inherit;
    background: #1c1c1e; border: 1px solid #48484a; border-radius: 4px; }
#go_dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; }
#go_dialog button { font: inherit; color: inherit; background: #3a3a3c; border: 1px solid #48484a; border-radius: 4px; padding: 4px 14px; cursor: pointer; }
#go_dialog button.ok { background: #2f5ea8; border-color: #2f5ea8; }
#go_dialog .quiet { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: .9em; color: #b8b8bd; }
#go_dialog .quiet input { width: auto; margin: 0; }
#go_dialog [hidden] { display: none; }
#go_start { grid-row: 2; grid-column: 1; z-index: 1; display: grid; place-content: center;
    padding: 24px calc(24px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(24px + var(--safe-left));
    text-align: center; color: #a8a8ad; background: #1c1c1e; }
#go_start[hidden] { display: none; }
#go_start h1 { margin: 0 0 8px; font-size: 20px; color: #e8e8ea; }
#go_start p { margin: 4px auto; max-width: 34rem; }
#go_recent { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px auto 0; padding: 0; max-width: 34rem; list-style: none; }
#go_recent[hidden], #go_recent_clear[hidden] { display: none; }
#go_recent button { min-height: 36px; padding: 0 14px; font: 14px system-ui, sans-serif; color: #e8e8ea; background: #2c2c2e;
    border: 1px solid #3a3a3c; border-radius: 18px; cursor: pointer; }
#go_recent_clear { margin-top: 12px; font: 13px system-ui, sans-serif; color: #a8a8ad; background: none; border: 0; text-decoration: underline; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }
#go_progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; overflow: hidden; pointer-events: none; }
#go_progress[hidden] { display: none; }
#go_progress::after { content: ""; display: block; width: 35%; height: 100%; background: #8ab4f8; animation: go-progress 1.2s ease-in-out infinite; }
@keyframes go-progress { from { transform: translateX(-100%); } to { transform: translateX(390%); } }
@media (prefers-reduced-motion: reduce) { #go_progress::after { width: 100%; animation: none; } }
#tabtop_reconnect { top: calc(var(--bar-total) + 8px) !important; }
#go_notice .actions { display: flex; flex-wrap: wrap; gap: 8px; }
#go_notice button[hidden] { display: none; }
@media (pointer: coarse), (max-width: 600px) {
    :root { --bar-height: 56px; }
    #go_bar { padding: var(--safe-top) calc(4px + var(--safe-right)) 0 calc(4px + var(--safe-left)); }
    #go_bar button { min-width: 44px; height: 44px; }
    #go_bar #go_address button { min-width: 44px; }
    #go_address input { height: 44px; padding-right: 44px; font-size: 16px; }
    #go_notice button, #go_dialog button, #tabtop_login_summary button, #go_popup button { min-height: 44px; }
    #go_menu_panel .item, #go_menu_panel .tabtop-nav > * { min-height: 44px; }
    #go_recent button { min-height: 44px; }
    /* Forward is in the menu: room for the address. */
    #go_forward { display: none !important; }
}
</style>
<div id="go_bar">
    <button type="button" id="go_back" title="Back (Alt+←)" aria-label="Back" disabled>←</button>
    <button type="button" id="go_forward" title="Forward (Alt+→)" aria-label="Forward" disabled>→</button>
    <form id="go_address" role="search">
        <input id="go_url" type="text" inputmode="url" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Address, or words to search for"
            placeholder="Address, or words to search for">
        <button type="button" id="go_reload" title="Reload" aria-label="Reload" disabled>⟳</button>
        <button type="button" id="go_clear" title="Clear" aria-label="Clear the address" hidden>✕</button>
    </form>
    <button type="button" id="go_tabs" title="Tabs" aria-label="Tabs" hidden><span class="count">1</span></button>
    <button type="button" id="go_menu" title="Menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="go_menu_panel"></button>
    <div id="go_menu_panel" hidden>
        <button type="button" class="item" id="go_menu_forward" disabled></button>
        <a class="item" id="go_menu_settings" href="settings" target="tabtop-go-settings"></a>
        <a class="item" id="go_menu_sites" href="cookie" target="tabtop-go-cookie"></a>
    </div>
    <div id="go_history" role="menu" hidden></div>
    <div id="go_progress" aria-hidden="true" hidden></div>
</div>
<div id="go_start">
    <div>
        <h1>Browser</h1>
        <p>Type an address, or words to search for, above.</p>
        <p>Pages open on the server and are shown here as a copy: sites see the server, never this device.</p>
        <ul id="go_recent" aria-label="Recent sites" hidden></ul>
        <button type="button" id="go_recent_clear" hidden>Forget recent sites</button>
    </div>
</div>
<div id="go_popup" role="alertdialog" aria-labelledby="go_popup_text" hidden><p id="go_popup_text"></p>
    <label class="remember"><input type="checkbox" checked> <span>Remember for this site</span></label>
    <div class="actions"><button type="button" class="open">Open</button><button type="button" class="refuse">Don’t open</button></div></div>
<div id="go_status" role="status" aria-live="polite"></div>
<div id="go_notice" role="alert" hidden><p></p><div class="actions"><button type="button" class="primary">Try again</button>
    <button type="button" class="edit" hidden>Edit address</button><button type="button" class="dismiss">Dismiss</button></div></div>
<dialog id="go_dialog"><form method="dialog"><p></p><input type="text" aria-label="Answer" hidden>
    <label class="quiet" hidden><input type="checkbox"> Don’t let this page ask again</label>
    <div class="buttons"><button type="button" class="cancel">Cancel</button><button type="submit" class="ok">OK</button></div></form></dialog>
<script type="module" src="go.js"></script>
</html>
