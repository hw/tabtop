<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Terminal</title>
<style>
@font-face { font-family: "Powerline Symbols"; src: url("PowerlineSymbols.otf") format("opentype"); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#terminal { position: absolute; inset: 34px 4px 4px; }
.tabtop-nav { position: absolute; top: 0; left: 0; right: 0; height: 30px; box-sizing: border-box; display: flex; align-items: center;
    gap: .5rem; padding: 0 .75rem; font: 13px system-ui, sans-serif; color: #a8a8ad; background: #1c1c1e;
    border-bottom: 1px solid #2c2c2e; }
.tabtop-nav .page { display: inline-flex; align-items: center; justify-content: center; padding: 2px; border-radius: 4px;
    color: #8ab4f8; }
.tabtop-nav .page svg { display: block; width: 20px; height: 20px; }
.tabtop-nav a.page:hover { background: #2c2c2e; }
.tabtop-nav .page[aria-current] { color: #e8e8ea; background: #3a3a3c; }
.tabtop-nav button { margin-left: auto; font: inherit; color: inherit; background: none; border: 1px solid #3a3a3c;
    border-radius: 4px; padding: 1px 8px; cursor: pointer; }
.tabtop-nav button:hover { color: #e8e8ea; }
/* Search opens out in place, from the button into the box. */
#tty_search { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
#tty_search:not(.open) { gap: 0; }  /* the folded box takes no room */
#tty_search + button { margin-left: 0; }
#tty_search button { margin-left: 0; }
/* Without tmux there's no Search, and what follows it goes to the right. */
#tty_search[hidden] { display: none; }
#tty_search[hidden] + button { margin-left: auto; }
#tty_search input { box-sizing: border-box; width: 0; min-width: 0; padding: 1px 0; border: 1px solid transparent; opacity: 0;
    visibility: hidden; font: 13px system-ui, sans-serif; color: #e8e8ea; background: #000; border-radius: 4px;
    transition: width .15s ease-out, opacity .15s, padding .15s, visibility 0s .15s; }
#tty_search.open input { width: min(16rem, 40vw); padding: 1px 6px; border-color: #3a3a3c; opacity: 1; visibility: visible;
    transition: width .15s ease-out, opacity .15s, padding .15s; }
#tty_search input::-webkit-search-cancel-button { display: none; }  /* ✕ does that */
#tty_search .step, #tty_search.open button.search { display: none; }
.tabtop-nav button.search, .tabtop-nav button.notify, .tabtop-nav button.logout { display: inline-flex; align-items: center;
    justify-content: center; padding: 1px 6px; }
.tabtop-nav button.search svg, .tabtop-nav button.notify svg, .tabtop-nav button.logout svg { display: block; width: 18px; height: 18px; }
.tabtop-nav button.notify + button { margin-left: 0; }
.tabtop-nav button.notify[aria-pressed=false] { opacity: .6; }
#tty_search.open .step { display: inline-block; min-width: 24px; padding: 1px 4px; }
@media (prefers-reduced-motion: reduce) { #tty_search input { transition: none; } }
body.touch-keys #terminal { bottom: 48px; }
#touch_keys { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; box-sizing: border-box; display: flex; gap: 4px;
    padding: 4px; overflow-x: auto; background: #1c1c1e; border-top: 1px solid #2c2c2e; }
#touch_keys button { flex: 0 0 auto; min-width: 42px; padding: 0 8px; font: 15px system-ui, sans-serif; color: #e8e8ea;
    background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 6px; touch-action: manipulation; }
#touch_keys button[aria-pressed=true] { color: #1c1c1e; background: #8ab4f8; border-color: #8ab4f8; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }
@media (max-width: 30rem) {
    #terminal { top: 76px; }
    .tabtop-nav { height: 72px; flex-wrap: wrap; align-content: center; gap: 4px 12px;
        padding: max(4px, env(safe-area-inset-top)) 8px 4px; }
    .tabtop-nav .page { min-width: 34px; min-height: 34px; box-sizing: border-box; }
    .tabtop-nav button { min-height: 34px; padding: 4px 10px; }
    /* Open, it takes the second row of the bar. */
    #tty_search.open { order: 1; flex: 1 0 100%; }
    #tty_search.open + button { margin-left: auto; }
    #tty_search.open input { width: auto; flex: 1; }
}
@media (pointer: coarse) {
    .tabtop-nav button, .tabtop-nav .page, #tty_search button { min-height: 40px; min-width: 40px; }
}
</style>
<div id="terminal"></div>
<script type="module" src="tty.js"></script>
</html>
