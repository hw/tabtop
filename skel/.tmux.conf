set  -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename-format "#{pane_current_command}#{?pane_dead,[dead],}"
setw -g aggressive-resize on
set  -g renumber-windows on

set  -g history-limit 50000
set  -g mouse on

set  -g set-clipboard on
setw -g allow-passthrough on
setw -g mode-keys vi

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind + split-window -h -c "#{pane_current_path}"
bind -r Tab select-pane -t :.+

bind \\ run-shell "tmux save-buffer - | ${HOME}/.local/bin/ssh-yank.sh > #{pane_tty}"
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

source-file ~/.config/tmux/theme.conf

set-hook -g pane-mode-changed "source-file ~/.config/tmux/status.conf"
set-hook -g after-select-window "source-file ~/.config/tmux/status.conf"
set-hook -g after-select-pane "source-file ~/.config/tmux/status.conf"

set-hook -g client-attached "source-file ~/.config/tmux/theme.conf"
set-hook -g client-session-changed "source-file ~/.config/tmux/theme.conf"

set -g status-left ""
set -g status-right "#{?@keybar,#{E:@keybar-format},}#[range=user|clock]#[fg=#{@fg},bg=#{@bg}]\ue0b2#[bg=#{@fg},fg=#{@bg}]%H:%M#[norange]"
set -g status-right-length 60
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@bg},bg=#{@bg}]\ue0b0#[fg=#{@fg},bg=#{@bg}]#I\ue0b1#{=/8/\u2026:window_name}#[fg=#{@bg},bg=#{@bg}]\ue0b0"
setw -g window-status-current-format "#[fg=#{@bg},bg=#{@fg}]\ue0b0#[fg=#{@bg},bg=#{@fg},bold]#I\ue0b1#{=/15/\u2026:window_name}#[fg=#{@fg},bg=#{@bg},nobold]\ue0b0"

# Keybar: click the clock to toggle clickable keys, shown right-aligned in
# status-right just before the clock. The window list keeps the left side and
# only gets trimmed (with < > markers) when the status line is too narrow.
# Each key is a user range; its name is the tmux key sent to the active pane.
# Hold is a toggle (Termux can't report a press-and-hold): while it is on,
# tapping a key repeats it until that key or Hold is tapped again.
set -g @keybar-format "\
#[range=user|Hold]#{?@keybar-hold,\ue0b2#[reverse bold],\ue0b3}\u27f3 #[norange default]\
#[range=user|Escape] ␛ #[norange default]\
#[range=user|Up] ↑ #[norange default]\
#[range=user|Down] ↓ #[norange default]\
#[range=user|PageUp] ⤒ #[norange default]\
#[range=user|PageDown] ⤓ #[norange default]\
#[range=user|Enter] ↵ #[norange default]"

# Lifting the finger must not stop Hold; clear leftovers from older configs.
unbind -n MouseUp1Status
unbind -n MouseDragEnd1Status

bind -n MouseDown1Status {
  if -F "#{==:#{mouse_status_range},clock}" {
    if -F "#{@keybar}" { set -gu @keybar ; set -gu @keybar-hold ; set -gu @keybar-held } { set -g @keybar 1 }
    refresh-client -S
  } {
    if -F "#{==:#{mouse_status_range},Hold}" {
      if -F "#{@keybar-hold}" { set -gu @keybar-hold ; set -gu @keybar-held } { set -g @keybar-hold 1 }
      refresh-client -S
    } {
      if -F "#{m/r:^(Up|Down|PageUp|PageDown|Escape|Enter)$,#{mouse_status_range}}" {
        if -F "#{&&:#{@keybar-hold},#{==:#{@keybar-held},#{mouse_status_range}}}" {
          set -gu @keybar-held
        } {
          run -C "send-keys #{mouse_status_range}"
          if -F "#{@keybar-hold}" {
            # Changing @keybar-held stops any loop repeating another key.
            set -gF @keybar-held "#{mouse_status_range}"
            # After 0.4s, repeat every ~250ms until stopped; give up after 100 repeats.
            run -b 'sleep 0.4; n=0; while [ "$(tmux show -gv @keybar-held 2>/dev/null)" = "#{mouse_status_range}" ] && [ $n -lt 100 ]; do tmux send-keys -t "#{pane_id}" "#{mouse_status_range}"; n=$((n+1)); sleep 0.25; done; if [ "$(tmux show -gv @keybar-held 2>/dev/null)" = "#{mouse_status_range}" ]; then tmux set -gu @keybar-held; fi'
          }
        }
      } {
        select-window -t =
      }
    }
  }
}
