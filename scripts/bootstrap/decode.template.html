<!DOCTYPE html>
<meta charset="utf-8">
<title>TabTop Bootstrap</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  code, pre { font-family: ui-monospace, monospace; font-size: 13px; }
  label { display: block; margin: 1rem 0 .35rem; }
  input, button { font: inherit; padding: .4rem .6rem; }
  input[type=password] { width: min(28rem, 100%); box-sizing: border-box; }
  input[type=file] { max-width: 100%; }
  #err { color: #b00020; white-space: pre-wrap; }
  #ok { color: #0d6b0d; white-space: pre-wrap; }
</style>
<h1>TabTop Bootstrap</h1>
<p>Enter the passcode from your trusted channel, then unlock: choose the
sealed pack from <code>&lt;base&gt;/auth/pack</code> when asked.</p>

<label for="pass">Passcode</label>
<input id="pass" type="password" autocomplete="off" spellcheck="false">
<p>
  <button type="button" id="go">Unlock…</button>
  <input id="packFile" type="file" accept=".pack,.txt,.json,text/plain,application/json" hidden>
  <button type="button" id="hashAny">Hash file…</button>
  <input id="hashFile" type="file" hidden>
</p>
<p id="err" hidden></p>
<p id="ok" hidden></p>
<p id="saveWrap" hidden>
  <button type="button" id="saveLocal">Download tabtop.html…</button>
  <button type="button" id="saveFolder" hidden>Save to folder…</button>
</p>
<pre id="hashOut" hidden></pre>
<script type="module">
let lastClient = null;

function fail(msg) {
  const err = document.getElementById("err");
  err.hidden = false;
  err.textContent = msg;
  document.getElementById("ok").hidden = true;
  document.getElementById("saveWrap").hidden = true;
  lastClient = null;
}

function downloadBlob(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10_000);
}

function b64dec(s) {
  const clean = String(s).replace(/\s+/g, "");
  if (!clean) throw new Error("Empty base64 field in pack.");
  if (typeof Uint8Array.fromBase64 === "function") {
    try { return Uint8Array.fromBase64(clean); }
    catch { throw new Error("Pack field is not valid base64."); }
  }
  let bin;
  try { bin = atob(clean); }
  catch { throw new Error("Pack field is not valid base64."); }
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// The browser's own cryptography (WebCrypto), which this page needs: it
// has it opened as a file (file:///…), over HTTPS, or on localhost; not
// over plain HTTP elsewhere, nor (perhaps) as some phones open a download.
const NO_SUBTLE = "This browser doesn't offer this page its cryptography here. Open the file directly " +
  "(file:///…) in a current Chrome, Edge, Firefox or Safari, or from https://, then try again.";
function needSubtle() {
  if (!(globalThis.isSecureContext && crypto?.subtle)) throw new Error(NO_SUBTLE);
  return crypto.subtle;
}

async function decryptPackBytes(pass, salt, iterations, iv, ct) {
  const subtle = needSubtle();
  const base = await subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"],
  );
  return new Uint8Array(await subtle.decrypt({ name: "AES-GCM", iv }, key, ct));
}

async function sha256Hex(buf) {
  const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
  const dig = await needSubtle().digest("SHA-256", bytes);
  return [...new Uint8Array(dig)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function parsePackText(text) {
  const t = text.replace(/^\uFEFF/, "").trim();
  if (!t) throw new Error("Pack file is empty.");
  let pack;
  if (t.startsWith("{")) {
    try { pack = JSON.parse(t); }
    catch { throw new Error("Pack file looks like JSON but is not valid."); }
  } else {
    try { pack = JSON.parse(new TextDecoder().decode(b64dec(t))); }
    catch (e) {
      throw new Error(e.message?.includes("base64") ? e.message : "Pack file is not valid base64 JSON.");
    }
  }
  if (pack.v !== 1 || pack.kdf !== "PBKDF2-SHA256" || pack.iter !== 210000)
    throw new Error("Unsupported pack version or parameters.");
  if (typeof pack.salt !== "string" || typeof pack.iv !== "string" || typeof pack.ct !== "string")
    throw new Error("Pack is missing salt, iv, or ct.");
  return pack;
}

async function unlock(pass, file) {
  const pack = parsePackText(await file.text());
  const salt = b64dec(pack.salt);
  const iv = b64dec(pack.iv);
  const ct = b64dec(pack.ct);
  if (salt.length !== 16 || iv.length !== 12) {
    throw new Error(`Unexpected salt/iv sizes (${salt.length}/${iv.length}); pack may be truncated.`);
  }
  let plain;
  try {
    plain = await decryptPackBytes(pass, salt, pack.iter, iv, ct);
  } catch (e) {
    if (/unsupported state|OperationError|decrypt failed|aes/i.test(String(e.message || e))) {
      throw new Error("Decrypt failed (wrong passcode or tampered/truncated pack). Nothing was run.");
    }
    throw e;
  }
  return new TextDecoder().decode(plain);
}

function parseClient(text) {
  if (!text.trimStart().startsWith("{")) return null;
  try {
    const obj = JSON.parse(text);
    if (obj?.format === "tabtop-pack/v1" && obj.files) return obj;
  } catch { /* not a client pack */ }
  return null;
}

// The one file saved, under a name fixed here, never one a pack gives:
// tabtop.html, the client, with all the rest of it inside.
function saveLocalHTML(client) {
  const html = client.files["tabtop.html"];
  if (typeof html !== "string" || !html) {
    throw new Error("This pack has no tabtop.html; re-download /auth/pack after the server rebuilds.");
  }
  downloadBlob("tabtop.html", new Blob([html], { type: "text/html; charset=utf-8" }));
}

// Each file of the client, into a folder chosen: its path in the pack split
// into folders, each a plain name (none "", ".", "..", nor with "\\" or
// ":"), so nothing's written outside the folder. All checked first: a pack
// with one such name writes nothing.
async function saveToFolder(client) {
  const files = Object.entries(client.files).map(([path, body]) => {
    const parts = String(path).split("/");
    if (parts.some((p) => !p || p === "." || p === ".." || /[\\:]/.test(p))) throw new Error(`This pack has a file named ${JSON.stringify(path)}, which can't be saved in a folder. Nothing was saved.`);
    const bytes = body && typeof body === "object" && typeof body.base64 === "string" ? b64dec(body.base64) : new TextEncoder().encode(String(body ?? ""));
    return { parts, bytes };
  });
  const root = await showDirectoryPicker({ mode: "readwrite" });
  for (const { parts, bytes } of files) {
    let dir = root;
    for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p, { create: true });
    const w = await (await dir.getFileHandle(parts.at(-1), { create: true })).createWritable();
    await w.write(bytes);
    await w.close();
  }
  return { count: files.length, name: root.name };
}

document.getElementById("saveLocal").onclick = () => {
  if (!lastClient) return;
  try {
    saveLocalHTML(lastClient);
    document.getElementById("ok").textContent = "Saved tabtop.html — open that file.";
  } catch (e) {
    fail(String(e.message || e));
  }
};

// (A browser without a folder picker, as Firefox and Safari: not offered.)
document.getElementById("saveFolder").hidden = typeof showDirectoryPicker !== "function";
document.getElementById("saveFolder").onclick = async () => {
  if (!lastClient) return;
  try {
    const { count, name } = await saveToFolder(lastClient);
    document.getElementById("ok").textContent = `Wrote ${count} files into “${name}”. Open tabtop.html in it.`;
  } catch (e) {
    if (e?.name === "AbortError") return;
    fail(String(e.message || e));
  }
};

// Unlock asks for the pack (as Hash file… asks for its file), then
// decrypts it with the passcode entered.
document.getElementById("go").onclick = () => {
  document.getElementById("err").hidden = true;
  if (!document.getElementById("pass").value.trim()) return fail("Enter the passcode.");
  document.getElementById("packFile").click();
};

document.getElementById("packFile").addEventListener("change", async () => {
  const input = document.getElementById("packFile");
  const file = input.files?.[0];
  input.value = "";
  if (!file) return;
  document.getElementById("err").hidden = true;
  document.getElementById("saveWrap").hidden = true;
  lastClient = null;
  const pass = document.getElementById("pass").value.trim();
  if (!pass) return fail("Enter the passcode.");
  const go = document.getElementById("go");
  const ok = document.getElementById("ok");
  go.disabled = true;
  ok.hidden = false;
  ok.textContent = `Unlocking ${file.name} (${(file.size / 1e6).toFixed(2)} MB)…`;
  try {
    const client = parseClient(await unlock(pass, file));
    if (!client) throw new Error("Decrypted, but this isn't a tabtop-pack/v1 client. Nothing was saved.");
    const html = client.files["tabtop.html"];
    if (typeof html !== "string" || !html) {
      throw new Error("This pack has no tabtop.html; re-download /auth/pack after the server rebuilds.");
    }
    lastClient = client;
    document.getElementById("saveWrap").hidden = false;
    saveLocalHTML(client);
    const n = Object.keys(client.files).length;
    const hash = await sha256Hex(new TextEncoder().encode(html));
    const note = "Saved tabtop.html — open that file.";
    ok.textContent = `Unlocked ${client.format} · ${client.name || "client"} · ${n} files.\n`
      + `tabtop.html SHA-256: ${hash}\n${note}`;
    ok.hidden = false;
  } catch (e) {
    fail(String(e.message || e));
  } finally {
    go.disabled = false;
  }
});

async function hashChosenFile(file) {
  const out = document.getElementById("hashOut");
  out.hidden = false;
  out.textContent = `Hashing ${file.name}…`;
  try {
    const hex = await sha256Hex(await file.arrayBuffer());
    out.textContent = `SHA-256 (${file.name}):\n${hex}`;
  } catch (e) {
    out.textContent = `Could not hash ${file.name}: ${e.message || e}`;
  }
}

document.getElementById("hashAny").onclick = () => {
  document.getElementById("hashFile").click();
};

document.getElementById("hashFile").addEventListener("change", async () => {
  const input = document.getElementById("hashFile");
  const file = input.files?.[0];
  input.value = "";
  if (!file) return;
  await hashChosenFile(file);
});

try { needSubtle(); } catch (e) { fail(e.message); }

document.getElementById("pass").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>
